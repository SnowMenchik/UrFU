name: Daily README Update

on:
  schedule:
    # Запуск каждый день в 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запустить вручную для теста

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даёт право на коммит и пуш

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with timestamp
        run: |
          echo "Last automated commit: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          # Коммитим только если есть изменения
          git diff --staged --quiet || git commit -m "Daily automated commit: $(date -u '+%Y-%m-%d')"
          git push
